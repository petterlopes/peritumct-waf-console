# Example compose — operator admin replica (policies + allowlists).
#
# Required for policy apply (SIGHUP CrowdSec) and cscli allowlists:
#   pid: host · user: "0:0" · host CrowdSec bind mounts · host cscli binary
# Image default USER is non-root (uid 65532); override as below for admin.
#
# Read-only dashboard replica: omit pid/user overrides and mount configs :ro.
# Never publish LAPI/AppSec/console. Never set WAF_TRAEFIK_DYNAMIC_DIR.
#
# Copy examples/sites.json → /var/lib/waf-control/sites.json before first start.
services:
  waf-console:
    build: .
    image: peritumct-waf-console:2.0.8
    container_name: waf-console
    network_mode: host
    pid: host
    user: "0:0"
    environment:
      WAF_BIND: "127.0.0.1"
      WAF_PORT: "18990"
      WAF_STATIC: /app/static
      WAF_APP_VERSION: "2.0.8"
      WAF_APP_PRODUCT: "waf-console"
      RUST_LOG: "warn"
      TOKIO_WORKER_THREADS: "4"
      WAF_PROBE_CACHE_TTL: "30"
      WAF_METRICS_CACHE_TTL: "12"
      WAF_ALERTS_CACHE_TTL: "10"
      WAF_ALERTS_LIMIT: "500"
      WAF_ENGINE_CACHE_TTL: "5"
      WAF_PROBE_WORKERS: "12"
      WAF_POST_RATE: "90"
      WAF_HEAVY_GET_RATE: "60"
      CROWDSEC_CREDS: /etc/crowdsec/local_api_credentials.yaml
      CROWDSEC_PROFILES: /etc/crowdsec/profiles.yaml
      CROWDSEC_CONFIG: /etc/crowdsec
      CROWDSEC_BOUNCER_KEY: /run/lapi_key
      CROWDSEC_METRICS: http://127.0.0.1:6060/metrics
      # Prefer remapped LAPI when Traefik occupies :8080
      CROWDSEC_LAPI: http://127.0.0.1:18080
      # Host cscli (image does not ship CrowdSec). Adjust path for the host OS.
      CROWDSEC_CSCLI: /usr/local/bin/cscli-host
      WAF_CONTROL: /var/lib/waf-control
      WAF_SITES_FILE: /var/lib/waf-control/sites.json
      WAF_ALLOWLIST: cso-operators
      PUBLIC_IP: ""
    volumes:
      # Host CrowdSec tree (replace paths for your install)
      - /etc/crowdsec:/etc/crowdsec:ro
      - /etc/crowdsec/appsec-configs:/etc/crowdsec/appsec-configs
      - /etc/crowdsec/acquis.d:/etc/crowdsec/acquis.d
      - /var/lib/waf-control:/var/lib/waf-control
      - /run/lapi_key:/run/lapi_key:ro
      - /usr/bin/cscli:/usr/local/bin/cscli-host:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
