# Example compose. Bind loopback only. Do not publish LAPI/AppSec.
# Copy examples/sites.json to the control volume before first start.
#
# Policy apply (SIGHUP CrowdSec) needs pid: host and a writable AppSec config
# mount. Drop pid: host if this replica is read-only.
services:
  waf-console:
    build: .
    image: peritumct-waf-console:2.0.0
    container_name: waf-console
    network_mode: host
    environment:
      WAF_BIND: "127.0.0.1"
      WAF_PORT: "18990"
      WAF_STATIC: /app/static
      WAF_APP_VERSION: "2.0.0"
      WAF_APP_PRODUCT: "waf-console"
      RUST_LOG: "info"
      CROWDSEC_CREDS: /etc/crowdsec/local_api_credentials.yaml
      CROWDSEC_PROFILES: /etc/crowdsec/profiles.yaml
      CROWDSEC_CONFIG: /etc/crowdsec
      CROWDSEC_BOUNCER_KEY: /run/lapi_key
      CROWDSEC_METRICS: http://127.0.0.1:6060/metrics
      CROWDSEC_CSCLI: /usr/bin/cscli
      WAF_CONTROL: /var/lib/waf-control
      WAF_SITES_FILE: /var/lib/waf-control/sites.json
      WAF_ALLOWLIST: cso-operators
      WAF_PROBE_CACHE_TTL: "20"
      WAF_METRICS_CACHE_TTL: "10"
      WAF_ALERTS_CACHE_TTL: "8"
      WAF_ENGINE_CACHE_TTL: "3"
      WAF_PROBE_WORKERS: "8"
      WAF_POST_RATE: "60"
      WAF_HEAVY_GET_RATE: "40"
      # Never set WAF_TRAEFIK_DYNAMIC_DIR. The console must not write Traefik files.
      PUBLIC_IP: ""
      # Optional edge marker + great-circle routes (operator-supplied, not GeoIP):
      # WAF_EDGE_LAT: "49.452"
      # WAF_EDGE_LON: "11.077"
      # WAF_EDGE_LABEL: "edge"
      # Optional CTI file-export status (never pushed; tokens never returned in JSON):
      # WAF_MISP_URL: "https://misp.example.invalid"
      # WAF_MISP_KEY: ""
      # WAF_THEHIVE_URL: "https://thehive.example.invalid"
      # WAF_THEHIVE_KEY: ""
      # WAF_OPENCTI_URL: "https://opencti.example.invalid"
      # WAF_OPENCTI_TOKEN: ""
      # WAF_GA_SNAPSHOT_FILE: /var/lib/waf-control/ga-snapshot.json
      # Never set GA measurement in the console process. Never gtag on /waf.
    volumes:
      - crowdsec-config:/etc/crowdsec:ro
      - crowdsec-appsec:/etc/crowdsec/appsec-configs
      - crowdsec-acquis:/etc/crowdsec/acquis.d
      - waf-control:/var/lib/waf-control
      - ./examples/lapi_key.example:/run/lapi_key:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
volumes:
  crowdsec-config:
  crowdsec-appsec:
  crowdsec-acquis:
  waf-control:
