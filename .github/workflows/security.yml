name: Security

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - name: cargo fmt
        run: cargo fmt --check
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy --all-targets -- -W clippy::correctness
        continue-on-error: true
      - name: cargo test
        run: cargo test --test unit_smoke --test parity_smoke
      - name: cargo audit (optional)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t peritumct-waf-console:ci .
      - name: Trivy image
        uses: aquasecurity/trivy-action@b6640a8a0553bb5a2d4878ae9ef2a02412e5dbd2 # v0.33.1
        with:
          scan-type: image
          image-ref: peritumct-waf-console:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Secret patterns
        run: bash scripts/verify-no-committed-secrets.sh

  legacy-python:
    # Rollback surface only — keep unit parity for legacy/python until decommissioned.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d0363a4f5565471df40efc17 # v5.6.0
        with:
          python-version: "3.12"
      - name: Legacy unit tests
        working-directory: legacy/python
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v
